<!-- Button Component HTML -->
<div class="button-showcase">
  <!-- Primary Button -->
  <button class="btn btn-primary" aria-label="Primary action button">
    Primary Button
  </button>

  <!-- Secondary Button -->
  <button class="btn btn-secondary" aria-label="Secondary action button">
    Secondary Button
  </button>

  <!-- Ghost Button -->
  <button class="btn btn-ghost" aria-label="Ghost action button">
    Ghost Button
  </button>

  <!-- Button with Icon -->
  <button class="btn btn-primary btn-icon" aria-label="Download file">
    <svg class="btn-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Download
  </button>

  <!-- Icon-only Button -->
  <button class="btn btn-icon-only" aria-label="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 1v6m0 6v6m4.22-13.22l4.24 4.24M1.54 12h6m6 0h6m-13.22 4.22l4.24 4.24"/>
    </svg>
  </button>

  <!-- Disabled Button -->
  <button class="btn btn-primary" disabled aria-label="Disabled button">
    Disabled Button
  </button>

  <!-- Loading Button -->
  <button class="btn btn-primary btn-loading" aria-label="Loading" aria-busy="true">
    <span class="btn-spinner"></span>
    Loading...
  </button>

  <!-- Button Sizes -->
  <button class="btn btn-primary btn-sm" aria-label="Small button">Small</button>
  <button class="btn btn-primary" aria-label="Medium button">Medium</button>
  <button class="btn btn-primary btn-lg" aria-label="Large button">Large</button>
</div>
