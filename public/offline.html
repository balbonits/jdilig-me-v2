<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - John Dilig Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        
        .offline-container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 3rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        
        .offline-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }
        
        .offline-description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .offline-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .cached-content {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .cached-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .cached-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 300px;
            margin: 0 auto;
        }
        
        .cached-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 0.5rem;
            border-radius: 0.25rem;
            transition: all 0.2s ease;
        }
        
        .cached-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        @media (max-width: 640px) {
            .offline-container {
                padding: 2rem 1.5rem;
            }
            
            .offline-title {
                font-size: 1.5rem;
            }
            
            .offline-description {
                font-size: 1rem;
            }
            
            .btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📱</div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-description">
            No internet connection detected. You can still browse cached content from my portfolio while offline.
        </p>
        
        <div class="offline-actions">
            <button onclick="tryReconnect()" class="btn btn-primary">
                🔄 Try Again
            </button>
            <a href="/" class="btn btn-primary">
                🏠 Go Home
            </a>
        </div>
        
        <div class="cached-content">
            <h3 class="cached-title">Available Offline</h3>
            <div class="cached-links">
                <a href="/" class="cached-link">🏠 Home</a>
                <a href="/about" class="cached-link">👨‍💻 About & Resume</a>
                <a href="/projects" class="cached-link">🚀 Projects</a>
                <a href="/code" class="cached-link">💻 Code Showcase</a>
            </div>
        </div>
    </div>

    <script>
        function tryReconnect() {
            // Check if back online
            if (navigator.onLine) {
                window.location.reload();
            } else {
                // Attempt to fetch a small resource
                fetch('/', { method: 'HEAD', mode: 'no-cors' })
                    .then(() => {
                        window.location.reload();
                    })
                    .catch(() => {
                        // Still offline, show feedback
                        const btn = event.target;
                        btn.textContent = '❌ Still Offline';
                        setTimeout(() => {
                            btn.innerHTML = '🔄 Try Again';
                        }, 2000);
                    });
            }
        }
        
        // Listen for online/offline events
        window.addEventListener('online', function() {
            // Auto-reload when back online
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });
        
        // Update UI based on connection status
        function updateConnectionStatus() {
            if (navigator.onLine) {
                tryReconnect();
            }
        }
        
        // Check connection status periodically
        setInterval(updateConnectionStatus, 5000);
    </script>
</body>
</html>
