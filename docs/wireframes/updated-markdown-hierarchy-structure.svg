<svg width="1400" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .page-title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #222; }
      .main-section-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2196F3; }
      .tab-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #FF9800; }
      .card-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #9C27B0; }
      .text { font-family: Arial, sans-serif; font-size: 11px; fill: #666; }
      .small-text { font-family: Arial, sans-serif; font-size: 9px; fill: #888; }
      .level-indicator { font-family: monospace; font-size: 10px; fill: #999; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="title">Updated Markdown Hierarchy Structure for Notes</text>
  <text x="700" y="65" text-anchor="middle" class="small-text">Level 3: Tabs | Level 4: Cards</text>

  <!-- Level 1: Entire Page -->
  <rect x="50" y="100" width="1300" height="1050" fill="#f8f9fa" stroke="#ddd" stroke-width="2" rx="8"/>
  <text x="60" y="130" class="level-indicator"># Level 1: Page Title</text>
  <text x="60" y="150" class="page-title">JavaScript Interview Cheat Sheet</text>
  <text x="60" y="175" class="text">Page intro content appears here...</text>

  <!-- Level 2: Main Section -->
  <rect x="80" y="220" width="1240" height="900" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="6"/>
  <text x="90" y="250" class="level-indicator">## Level 2: Main Section (Section component)</text>
  <text x="90" y="275" class="main-section-title">📚 Core Concepts</text>
  <text x="90" y="300" class="text">Main section content goes here...</text>

  <!-- Level 3: Tab Navigation -->
  <rect x="110" y="330" width="1180" height="50" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="4"/>
  <text x="120" y="350" class="level-indicator">### Level 3: Tab Navigation (TabContainer)</text>
  
  <!-- Tab Headers -->
  <rect x="120" y="365" width="150" height="35" fill="#FF9800" stroke="#F57C00" stroke-width="1" rx="8 8 0 0"/>
  <text x="195" y="385" text-anchor="middle" class="tab-title" fill="white">Modern Features</text>
  
  <rect x="270" y="365" width="120" height="35" fill="#fff3e0" stroke="#FF9800" stroke-width="1" rx="8 8 0 0"/>
  <text x="330" y="385" text-anchor="middle" class="tab-title">Async Patterns</text>
  
  <rect x="390" y="365" width="100" height="35" fill="#fff3e0" stroke="#FF9800" stroke-width="1" rx="8 8 0 0"/>
  <text x="440" y="385" text-anchor="middle" class="tab-title">Shortcuts</text>

  <!-- Level 3: Tab Content Area -->
  <rect x="110" y="400" width="1180" height="700" fill="#fffef5" stroke="#FF9800" stroke-width="2" rx="0 6 6 6"/>
  <text x="120" y="425" class="text">Tab content: Modern ECMAScript Features (ES2015+)</text>
  <text x="120" y="445" class="text">Some descriptive content for this tab section...</text>

  <!-- Level 4: Cards Grid -->
  <text x="120" y="475" class="level-indicator">#### Level 4: Cards (Card components in responsive grid)</text>
  
  <!-- Card 1 -->
  <rect x="130" y="490" width="360" height="180" fill="#fce4ec" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="140" y="515" class="card-title">ES2015 Core Features</text>
  <rect x="140" y="525" width="340" height="135" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="4"/>
  <text x="150" y="545" class="text">```javascript</text>
  <text x="150" y="565" class="text">// Destructuring Assignment</text>
  <text x="150" y="580" class="text">const [first, second] = [1, 2];</text>
  <text x="150" y="595" class="text">// Template Literals</text>
  <text x="150" y="610" class="text">const msg = `Hello ${name}`;</text>
  <text x="150" y="625" class="text">// Arrow Functions</text>
  <text x="150" y="640" class="text">const add = (a, b) => a + b;</text>
  <text x="150" y="655" class="text">```</text>

  <!-- Card 2 -->
  <rect x="510" y="490" width="360" height="180" fill="#fce4ec" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="520" y="515" class="card-title">ES2017+ Features</text>
  <rect x="520" y="525" width="340" height="135" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="4"/>
  <text x="530" y="545" class="text">```javascript</text>
  <text x="530" y="565" class="text">// Async/Await</text>
  <text x="530" y="580" class="text">async function fetchData() {</text>
  <text x="530" y="595" class="text">  const result = await api.get();</text>
  <text x="530" y="610" class="text">  return result.data;</text>
  <text x="530" y="625" class="text">}</text>
  <text x="530" y="640" class="text">// Object spread</text>
  <text x="530" y="655" class="text">const merged = {...obj1, ...obj2};</text>

  <!-- Card 3 -->
  <rect x="890" y="490" width="360" height="180" fill="#fce4ec" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="900" y="515" class="card-title">Performance Patterns</text>
  <rect x="900" y="525" width="340" height="135" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="4"/>
  <text x="910" y="545" class="text">• Debouncing &amp; Throttling</text>
  <text x="910" y="565" class="text">• Memoization techniques</text>
  <text x="910" y="580" class="text">• Lazy loading patterns</text>
  <text x="910" y="595" class="text">• Virtual DOM concepts</text>
  <text x="910" y="610" class="text">• Bundle splitting</text>
  <text x="910" y="625" class="text">• Code optimization</text>

  <!-- More cards in second row -->
  <rect x="130" y="690" width="360" height="180" fill="#fce4ec" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="140" y="715" class="card-title">Module Systems</text>
  <rect x="140" y="725" width="340" height="135" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="4"/>
  <text x="150" y="745" class="text">```javascript</text>
  <text x="150" y="765" class="text">// ES6 Modules</text>
  <text x="150" y="780" class="text">import { func } from './module';</text>
  <text x="150" y="795" class="text">export default MyComponent;</text>
  <text x="150" y="810" class="text">// Dynamic imports</text>
  <text x="150" y="825" class="text">const mod = await import('./lazy');</text>
  <text x="150" y="840" class="text">```</text>

  <rect x="510" y="690" width="360" height="180" fill="#fce4ec" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="520" y="715" class="card-title">Advanced Patterns</text>
  <rect x="520" y="725" width="340" height="135" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="4"/>
  <text x="530" y="745" class="text">• Closures &amp; Scope</text>
  <text x="530" y="765" class="text">• Prototypal inheritance</text>
  <text x="530" y="780" class="text">• Event delegation</text>
  <text x="530" y="795" class="text">• Functional programming</text>
  <text x="530" y="810" class="text">• Design patterns</text>
  <text x="530" y="825" class="text">• Error handling</text>

  <rect x="890" y="690" width="360" height="180" fill="#fce4ec" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="900" y="715" class="card-title">Testing Patterns</text>
  <rect x="900" y="725" width="340" height="135" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="4"/>
  <text x="910" y="745" class="text">```javascript</text>
  <text x="910" y="765" class="text">// Unit testing</text>
  <text x="910" y="780" class="text">test('adds numbers', () => {</text>
  <text x="910" y="795" class="text">  expect(add(2, 3)).toBe(5);</text>
  <text x="910" y="810" class="text">});</text>
  <text x="910" y="825" class="text">```</text>

  <!-- Legend -->
  <rect x="50" y="1170" width="1300" height="60" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="60" y="1190" class="title">Legend:</text>
  <text x="60" y="1210" class="text">Level 2: Section component (blue border) | Level 3: TabContainer (orange tabs) | Level 4: Card components (purple cards in responsive grid)</text>
  <text x="60" y="1225" class="small-text">Structure: Page → Main Sections → Tab Navigation → Card Grid Layout</text>
</svg>